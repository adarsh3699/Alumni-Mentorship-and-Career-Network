openapi: 3.1.0
info:
  title: P11 Alumni Mentorship and Career Network API
  version: 1.0.0
  description: |
    REST API contract for Project P11 — Verified Alumni Mentorship Matching and Engagement Platform.
    The API is versioned under /api/v1 and is derived from the P11 PRD, SRS,
    HLD, and the P11 project specification.
    Cookie-authenticated state-changing requests require a valid X-CSRF-Token,
    SameSite cookie policy, and Origin/Referer validation. Access tokens are
    short-lived; refresh tokens are rotated and revoked server-side.

servers:
  - url: /api/v1
    description: Application API

tags:
  - name: Identity
    description: Current authenticated user context.
  - name: Alumni Verification
    description: Alumni verification workflow.
  - name: Mentor Profile
    description: Verified mentor profile, capacity, and availability.
  - name: Student Profile
    description: Student career profile.
  - name: Matching
    description: Mentor discovery, ranking, and match explanations.
  - name: Mentorship Requests
    description: Mentorship request lifecycle.
  - name: Mentorships
    description: Accepted mentoring relationships.
  - name: Sessions
    description: Mentoring session scheduling and records.
  - name: Goals
    description: Mentoring goals and action items.
  - name: Feedback
    description: Bidirectional mentorship feedback.
  - name: Engagement
    description: Mentorship relationship engagement.
  - name: Messaging
    description: Relationship-scoped in-platform messaging.
  - name: Analytics
    description: Programme-level analytics.
  - name: Administration
    description: Programme configuration.

security:
  - accessToken: []

paths:

  /me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Get current user context
      responses:
        '200':
          description: Current authenticated user context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      security:
        - refreshToken: []
          csrfToken: []
      tags: [Identity]
      operationId: refreshAccessToken
      summary: Rotate the authenticated session tokens
      description: Validates the refresh_token HTTP-only cookie, rotates and revokes the refresh token, and issues a new short-lived access_token and refresh_token cookie pair. The request requires the CSRF protections described at the API level.
      responses:
        '204':
          description: Tokens rotated and set in secure HTTP-only cookies.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      security:
        - accessToken: []
          csrfToken: []
      tags: [Identity]
      operationId: logout
      summary: Revoke the current session
      description: Revokes the current refresh-token family and clears the access_token and refresh_token HTTP-only cookies. The request requires the CSRF protections described at the API level.
      responses:
        '204':
          description: Session revoked and cookies cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /alumni/verify:
    get:
      tags: [Alumni Verification]
      operationId: listVerificationRequests
      summary: List alumni verification requests for the review queue
      description: Requires the Alumni Relations Officer role. Results are institution-scoped and paginated.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, verified, rejected]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated verification review queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Alumni Verification]
      operationId: submitAlumniVerification
      summary: Submit alumni verification request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationSubmission'
      responses:
        '201':
          description: Verification request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /alumni/verify/{requestId}:
    get:
      tags: [Alumni Verification]
      operationId: getVerificationRequest
      summary: Get an alumni verification request
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Verification request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /alumni/verify/{requestId}/decision:
    post:
      tags: [Alumni Verification]
      operationId: decideAlumniVerification
      summary: Approve or reject an alumni verification request
      description: Requires an authorized Alumni Relations Officer.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecision'
      responses:
        '200':
          description: Verification decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /alumni/verify/{requestId}/documents/upload-url:
    post:
      tags: [Alumni Verification]
      operationId: createVerificationDocumentUploadUrl
      summary: Create a pre-signed verification-document upload URL
      description: The client uploads the document directly to approved object storage using the returned short-lived URL. The document remains unavailable for review until the finalize operation validates the uploaded bytes and completes malware scanning.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDocumentUploadRequest'
      responses:
        '200':
          description: Pre-signed upload URL created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationDocumentUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /alumni/verify/{requestId}/documents/{documentId}/finalize:
    post:
      tags: [Alumni Verification]
      operationId: finalizeVerificationDocumentUpload
      summary: Finalize and validate an uploaded verification document
      description: Requires the Alumni Relations Officer or the submitting alumnus for the matching request. The server validates detected MIME type, magic bytes, size, and malware status from the uploaded object. The document transitions to validating and cannot be reviewed until validation succeeds.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '202':
          description: Document accepted for validation/quarantine processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /alumni/verify/{requestId}/documents/{documentId}/view-url:
    get:
      tags: [Alumni Verification]
      operationId: createVerificationDocumentViewUrl
      summary: Create a short-lived authorized document view URL
      description: Requires an authorized Alumni Relations Officer and an approved document. The returned signed URL is short-lived and must not be persisted as a permanent link.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Short-lived signed document URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationDocumentViewUrl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mentors/me:
    get:
      tags: [Mentor Profile]
      operationId: getMyMentorProfile
      summary: Get current mentor profile
      responses:
        '200':
          description: Mentor profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Mentor Profile]
      operationId: updateMyMentorProfile
      summary: Update current mentor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorProfileUpdate'
      responses:
        '200':
          description: Updated mentor profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mentors/me/capacity:
    put:
      tags: [Mentor Profile]
      operationId: updateMentorCapacity
      summary: Update mentor capacity and participation status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorCapacityUpdate'
      responses:
        '200':
          description: Updated mentor capacity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorCapacity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mentors/me/availability:
    put:
      tags: [Mentor Profile]
      operationId: replaceMentorAvailability
      summary: Replace mentor availability windows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AvailabilityWindowInput'
      responses:
        '200':
          description: Updated availability.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityWindow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mentors/search:
    get:
      tags: [Matching]
      operationId: searchMentors
      summary: Search and rank available mentors
      description: |
        Returns mentors eligible for discovery and request. Student-visible mentor
        representations must not contain private alumni email or phone fields.
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: expertise
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: industry
          in: query
          schema:
            type: string
        - name: targetRole
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Ranked mentor results with explanations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /students/me/career-profile:
    get:
      tags: [Student Profile]
      operationId: getMyCareerProfile
      summary: Get current student career profile
      responses:
        '200':
          description: Career profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Student Profile]
      operationId: replaceMyCareerProfile
      summary: Replace current student career profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentProfileInput'
      responses:
        '200':
          description: Updated career profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /students/me/career-goals:
    get:
      tags: [Student Profile]
      operationId: listMyCareerGoals
      summary: List current student's career goals
      responses:
        '200':
          description: Student career goals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerGoalListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Student Profile]
      operationId: createMyCareerGoal
      summary: Create a career goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareerGoalCreate'
      responses:
        '201':
          description: Career goal created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerGoal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /students/me/career-goals/{goalId}:
    patch:
      tags: [Student Profile]
      operationId: updateMyCareerGoal
      summary: Update a career goal
      parameters:
        - $ref: '#/components/parameters/GoalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareerGoalUpdate'
      responses:
        '200':
          description: Career goal updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerGoal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /requests:
    post:
      tags: [Mentorship Requests]
      operationId: createMentorshipRequest
      summary: Create a mentorship request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorshipRequestCreate'
      responses:
        '201':
          description: Mentorship request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorshipRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Mentorship Requests]
      operationId: listMentorshipRequests
      summary: List mentorship requests
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum: [incoming, outgoing]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, declined, expired]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated mentorship requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorshipRequestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /requests/{requestId}:
    get:
      tags: [Mentorship Requests]
      operationId: getMentorshipRequest
      summary: Get a mentorship request
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Mentorship request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorshipRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /requests/{requestId}/accept:
    post:
      tags: [Mentorship Requests]
      operationId: acceptMentorshipRequest
      summary: Accept a mentorship request
      description: |
        The operation is capacity-safe under concurrent acceptance. If mentor capacity
        is no longer available, no active mentorship is created.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '201':
          description: Mentorship created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mentorship'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /requests/{requestId}/decline:
    post:
      tags: [Mentorship Requests]
      operationId: declineMentorshipRequest
      summary: Decline a mentorship request
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorshipRequestDecline'
      responses:
        '200':
          description: Declined mentorship request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorshipRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mentorships:
    get:
      tags: [Mentorships]
      operationId: listMentorships
      summary: List current user's mentorships
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, ended]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated mentorships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorshipListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mentorships/{mentorshipId}:
    get:
      tags: [Mentorships]
      operationId: getMentorship
      summary: Get a mentorship relationship
      parameters:
        - $ref: '#/components/parameters/MentorshipId'
      responses:
        '200':
          description: Mentorship relationship.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mentorship'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mentorships/{mentorshipId}/end:
    post:
      tags: [Mentorships]
      operationId: endMentorship
      summary: End an active mentorship
      parameters:
        - $ref: '#/components/parameters/MentorshipId'
      responses:
        '200':
          description: Mentorship ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mentorship'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mentorships/{mentorshipId}/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List mentorship sessions
      parameters:
        - $ref: '#/components/parameters/MentorshipId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Propose a mentorship session
      parameters:
        - $ref: '#/components/parameters/MentorshipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Session proposal created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mentorships/{mentorshipId}/sessions/{sessionId}:
    patch:
      tags: [Sessions]
      operationId: updateSession
      summary: Update a mentorship session
      description: Setting status to scheduled confirms a proposed session. A proposed session may be cancelled, while a scheduled session may later be completed or cancelled.
      parameters:
        - $ref: '#/components/parameters/MentorshipId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdate'
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
