components:

  securitySchemes:
    accessToken:
      type: apiKey
      in: cookie
      name: access_token
      description: Short-lived JWT access token stored in an HTTP-only, Secure cookie. Authentication is established through university SSO/OIDC. Cookie-authenticated state-changing operations also require X-CSRF-Token and SameSite plus Origin/Referer validation.
    refreshToken:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Rotated refresh token stored in an HTTP-only, Secure cookie. It is accepted only by POST /auth/refresh and is revoked on rotation or logout.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on cookie-authenticated state-changing requests. The server validates the token together with the request origin and SameSite policy.

  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
    MentorshipId:
      name: mentorshipId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    GoalId:
      name: goalId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CalendarProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, outlook]

  responses:
    BadRequest:
      description: Invalid input or validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Business-state conflict, such as capacity reached or invalid state transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Configured request throttle or applicable rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
      additionalProperties: false

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      additionalProperties: false

    CurrentUser:
      type: object
      required: [id, role]
      properties:
        id:
          type: string
        role:
          type: string
          enum:
            - student
            - alumni_mentor
            - alumni_relations_officer
            - placement_officer
            - administrator
      additionalProperties: false

    VerificationSubmission:
      type: object
      required: [institutionalIdentifier]
      properties:
        institutionalIdentifier:
          type: string
        graduationYear:
          type: integer
          minimum: 1900
        documents:
          type: array
          description: Optional document identifiers obtained from the verification-document upload flow.
          items:
            type: string
      additionalProperties: false

    VerificationDocumentUploadRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
      additionalProperties: false

    VerificationDocumentUpload:
      type: object
      required: [documentId, uploadUrl, expiresAt, status]
      properties:
        documentId:
          type: string
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending_upload]
      additionalProperties: false

    VerificationDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [verified, rejected]
        rejectionReason:
          type: string
      additionalProperties: false

    VerificationRequest:
      type: object
      required: [id, status, submittedAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, verified, rejected]
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/VerificationDocument'
      additionalProperties: false

    VerificationRequestListResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VerificationRequest'
        meta:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: false

    VerificationDocument:
      type: object
      required: [id, fileName, status]
      properties:
        id:
          type: string
        fileName:
          type: string
        status:
          type: string
          enum: [pending_upload, validating, approved, rejected]
        validationMessage:
          type: string
          description: Non-sensitive validation result presented to an authorized reviewer.
      additionalProperties: false

    VerificationDocumentViewUrl:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: Short-lived signed URL. It must not be persisted as a permanent application link.
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false

    CalendarAuthorization:
      type: object
      required: [provider, authorizationUrl, expiresAt]
      properties:
        provider:
          type: string
          enum: [google, outlook]
        authorizationUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false

    CalendarConnection:
      type: object
      required: [provider, connected]
      properties:
        provider:
          type: string
          enum: [google, outlook]
        connected:
          type: boolean
      additionalProperties: false

    MentorProfileUpdate:
      type: object
      properties:
        professionalHeadline:
          type: string
        currentRole:
          type: string
        industry:
          type: string
        expertise:
          type: array
          description: Expertise taxonomy names represented from the mentor's persisted expertise-tag references.
          items:
            type: string
        mentoringInterests:
          type: array
          items:
            type: string
      additionalProperties: false

    MentorProfile:
      type: object
      required: [id, displayName, verificationStatus, expertise, mentoringInterests, capacity]
      properties:
        id:
          type: string
        displayName:
          type: string
        verificationStatus:
          type: string
          enum: [verified]
        professionalHeadline:
          type: string
        currentRole:
          type: string
        industry:
          type: string
        expertise:
          type: array
          description: Expertise taxonomy names represented from the mentor's persisted expertise-tag references.
          items:
            type: string
        mentoringInterests:
          type: array
          items:
            type: string
        capacity:
          $ref: '#/components/schemas/MentorCapacity'
        availability:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityWindow'
      additionalProperties: false

    MentorCapacityUpdate:
      type: object
      required: [maxConcurrentMentees, acceptingNewMentees]
      properties:
        maxConcurrentMentees:
          type: integer
          minimum: 0
        acceptingNewMentees:
          type: boolean
      additionalProperties: false

    MentorCapacity:
      type: object
      required: [maxConcurrentMentees, activeMentees, availableSlots, acceptingNewMentees]
      properties:
        maxConcurrentMentees:
          type: integer
          minimum: 0
        activeMentees:
          type: integer
          minimum: 0
        availableSlots:
          type: integer
          minimum: 0
        acceptingNewMentees:
          type: boolean
      additionalProperties: false

    AvailabilityWindowInput:
      type: object
      required: [startAt, endAt, timezone]
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        timezone:
          type: string
      additionalProperties: false

    AvailabilityWindow:
      type: object
      required: [id, startAt, endAt, timezone]
      properties:
        id:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        timezone:
          type: string
      additionalProperties: false

    StudentProfileInput:
      type: object
      required: [interests, targetRoles, targetIndustries]
      properties:
        interests:
          type: array
          items:
            type: string
        targetRoles:
          type: array
          items:
            type: string
        targetIndustries:
          type: array
          items:
            type: string
      additionalProperties: false

    StudentProfile:
      type: object
      required: [id, interests, targetRoles, targetIndustries]
      properties:
        id:
          type: string
        interests:
          type: array
          items:
            type: string
        targetRoles:
          type: array
          items:
            type: string
        targetIndustries:
          type: array
          items:
            type: string
        careerGoals:
          type: array
          description: Read-only career-goal resources. Manage them through the career-goals endpoints; they are stored separately from StudentProfile.
